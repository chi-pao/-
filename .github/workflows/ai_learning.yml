name: Real-estate AI research and safe promotion
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
concurrency:
  group: ai-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore training archive from configured source
        env:
          TRAINING_ARCHIVE_URL: ${{ secrets.TRAINING_ARCHIVE_URL }}
        run: |
          mkdir -p data
          if [ -n "$TRAINING_ARCHIVE_URL" ] && [ ! -s data/All_20214_20254.zip ]; then
            curl --fail --location --retry 3 --max-time 300 "$TRAINING_ARCHIVE_URL" -o data/All_20214_20254.zip
            python -c "import zipfile; p='data/All_20214_20254.zip'; assert zipfile.is_zipfile(p)"
          fi
      - name: Find training data
        id: data
        shell: bash
        run: |
          if find data -maxdepth 2 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No training ZIP in data/. Existing live model is preserved."
          fi
      - name: Research a new candidate
        if: steps.data.outputs.available == 'true'
        run: python research_adaptive.py --site . --rounds 12
      - name: Preserve learning report and challenger model
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: property-ai-research
          path: |
            models/candidates/adaptive_research_report.json
            models/candidates/adaptive_used_house_candidate.joblib
          retention-days: 30
          if-no-files-found: error
      - name: Check independently held-out evaluation data
        id: holdout
        shell: bash
        run: |
          if test -s data/unused_holdout.csv && test -s models/candidates/v7_used_house_candidate.joblib && test -s models/candidates/adaptive_used_house_candidate.joblib; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing independent holdout or model. Promotion is blocked."
          fi
      - name: Promote only after independent accuracy test
        id: promotion
        if: steps.data.outputs.available == 'true' && steps.holdout.outputs.available == 'true'
        run: |
          python promote_used_house.py \
            --incumbent models/candidates/v7_used_house_candidate.joblib \
            --challenger models/candidates/adaptive_used_house_candidate.joblib \
            --holdout data/unused_holdout.csv \
            --holdout-year 2026 --site .
      - name: Commit approved artifacts only
        if: steps.promotion.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/candidates/approved_used_house.joblib models/candidates/approved_used_house.json
          if ! git diff --cached --quiet; then
            git commit -m "Promote independently verified used-house model"
            git push
          fi
