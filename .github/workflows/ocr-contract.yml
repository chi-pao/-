name: OCR autofill contract
on:
  push:
    paths:
      - app.py
      - tests/test_ocr_contract.py
      - .github/workflows/ocr-contract.yml
  workflow_dispatch:
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check screenshot OCR field mapping against reference text
        run: python -m unittest discover -s tests -p 'test_ocr_contract.py' -v
