name: Real-estate AI research and safe promotion
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_adaptive.py'
      - 'legacy_engine.py'
      - 'mlit_updater.py'
      - 'prepare_mlit_holdout.py'
      - 'tests/test_mlit_data.py'
      - 'promote_used_house.py'
      - 'evaluation_policy.py'
      - 'tests/test_promotion.py'
      - 'export_sites_model.py'
      - 'verify_sites_export.mjs'
      - 'sites_model_runtime.mjs'
      - '.github/workflows/ai_learning.yml'
  schedule:
    - cron: '17 2 5 * *'
permissions:
  contents: write
concurrency:
  group: ai-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check promotion and research Python syntax
        run: python -m py_compile evaluation_policy.py promote_used_house.py research_adaptive.py legacy_engine.py prepare_mlit_holdout.py export_sites_model.py app.py
      - name: Test model promotion safeguards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Restore training archive and V7 baseline from GitHub Release
        shell: bash
        run: |
          mkdir -p data models/candidates
          RELEASE_URL="https://github.com/chi-pao/-/releases/download/ai-training-data-v1"
          if [ ! -s data/All_20214_20254.zip ]; then
            curl --fail --location --retry 3 --max-time 300 "$RELEASE_URL/All_20214_20254.zip" -o data/All_20214_20254.zip
          fi
          python -c "import zipfile; assert zipfile.is_zipfile('data/All_20214_20254.zip')"
          if [ ! -s models/candidates/v7_used_house_candidate.joblib ]; then
            curl --fail --location --retry 3 --max-time 300 "$RELEASE_URL/v7_used_house_candidate.joblib" -o models/candidates/v7_used_house_candidate.joblib
          fi
          python -c "from pathlib import Path; assert Path('models/candidates/v7_used_house_candidate.joblib').stat().st_size > 1000000"
      - name: Fetch current MLIT data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MLIT_API_KEY: ${{ secrets.MLIT_API_KEY }}
        run: |
          if [ -z "$MLIT_API_KEY" ]; then
            echo "::warning::MLIT_API_KEY is not configured; no new quarterly transactions were fetched."
            exit 0
          fi
          python mlit_updater.py
      - name: Prepare the latest quarter as holdout
        id: mlit_holdout
        shell: bash
        run: |
          if find data -maxdepth 1 -type f -name 'mlit_*.csv' -print -quit | grep -q .; then
            python prepare_mlit_holdout.py --root . --output data/unused_holdout.csv --metadata data/mlit_latest_holdout.json
          else
            echo "::warning::No MLIT quarterly files are available; configured external holdout can still be used."
          fi
      - name: Find training data
        id: data
        shell: bash
        run: |
          if find data -maxdepth 2 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No training ZIP in data/. Existing live model is preserved."
          fi
      - name: Research a new candidate
        if: steps.data.outputs.available == 'true'
        run: python research_adaptive.py --site . --rounds 2
      - name: Preserve learning report and challenger model
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: property-ai-research
          path: |
            models/candidates/adaptive_research_report.json
            models/candidates/adaptive_used_house_candidate.joblib
          retention-days: 30
          if-no-files-found: error
      - name: Save learning history for the next scheduled run
        if: steps.data.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/candidates/adaptive_research_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record autonomous learning history"
            git push
          fi
      # Dates alone do not establish independence. Historical rows require a pinned
      # private audit covering all model training, selection and evaluation exposure.
      # Never relabel previously inspected 2024/2025 rows as unused.
      - name: Restore independently sourced holdout when configured
        shell: bash
        env:
          INDEPENDENT_HOLDOUT_URL: ${{ secrets.INDEPENDENT_HOLDOUT_URL }}
          EVALUATION_AUDIT_URL: ${{ secrets.EVALUATION_AUDIT_URL }}
        run: |
          if [ -n "$INDEPENDENT_HOLDOUT_URL" ] && [ ! -s data/unused_holdout.csv ]; then
            mkdir -p data
            curl --fail --location --retry 3 --max-time 300 "$INDEPENDENT_HOLDOUT_URL" -o data/unused_holdout.csv
          fi
          if [ -n "$EVALUATION_AUDIT_URL" ]; then
            curl --fail --location --retry 3 --max-time 300 "$EVALUATION_AUDIT_URL" -o data/evaluation_audit.json
          fi
      - name: Check independently held-out evaluation data
        id: holdout
        shell: bash
        env:
          MLIT_HOLDOUT_SHA256: ${{ steps.mlit_holdout.outputs.sha256 }}
          INDEPENDENT_HOLDOUT_SHA256: ${{ secrets.INDEPENDENT_HOLDOUT_SHA256 }}
        run: |
          expected="$MLIT_HOLDOUT_SHA256"
          if [ -z "$expected" ]; then expected="$INDEPENDENT_HOLDOUT_SHA256"; fi
          if ! test -s data/unused_holdout.csv || ! test -s models/candidates/v7_used_house_candidate.joblib || ! test -s models/candidates/adaptive_used_house_candidate.joblib; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No fresh MLIT or configured external holdout; the live model is preserved."
          elif ! printf '%s' "$expected" | grep -Eq '^[0-9a-fA-F]{64}      - name: Validate independent evaluation year
        id: holdoutyear
        if: steps.holdout.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          years = pd.to_numeric(pd.read_csv('data/unused_holdout.csv', usecols=['TransactionYear'])['TransactionYear'], errors='coerce')
          if years.isna().any() or not years.ge(1900).all() or not years.le(2200).all() or not years.eq(years.astype(int)).all():
              raise SystemExit('Holdout requires valid transaction years; exposure independence is checked before scoring')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('year=' + str(int(years.min())) + chr(10))
          PY
      - name: Choose current approved model as comparison baseline
        id: incumbent
        if: steps.data.outputs.available == 'true' && steps.holdout.outputs.available == 'true'
        shell: bash
        run: |
          if test -s models/candidates/approved_used_house.joblib && test -s models/candidates/approved_used_house.json; then
            python -c 'import json,hashlib,pathlib; p=pathlib.Path("models/candidates/approved_used_house.joblib"); m=json.loads(pathlib.Path("models/candidates/approved_used_house.json").read_text()); assert m.get("approved") is True and m.get("sha256")==hashlib.sha256(p.read_bytes()).hexdigest()'
            echo "path=models/candidates/approved_used_house.joblib" >> "$GITHUB_OUTPUT"
          elif test -s models/candidates/v7_used_house_candidate.joblib; then
            echo "path=models/candidates/v7_used_house_candidate.joblib" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither approved nor V7 incumbent exists in this runner; promotion cannot safely proceed."
            exit 1
          fi
      - name: Promote only after independent accuracy test
        id: promotion
        if: steps.data.outputs.available == 'true' && steps.holdout.outputs.available == 'true'
        env:
          EVALUATION_AUDIT_SHA256: ${{ secrets.EVALUATION_AUDIT_SHA256 }}
        run: |
          python promote_used_house.py \
            --incumbent ${{ steps.incumbent.outputs.path }} \
            --challenger models/candidates/adaptive_used_house_candidate.joblib \
            --holdout data/unused_holdout.csv \
            --holdout-year ${{ steps.holdoutyear.outputs.year }} --site .
      - name: Commit approved artifacts only
        if: steps.promotion.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/candidates/approved_used_house.joblib models/candidates/approved_used_house.json
          if ! git diff --cached --quiet; then
            git commit -m "Promote independently verified used-house model"
            git push
          fi

      - name: Export independently approved model for the Sites checker
        id: sites_bridge
        if: steps.promotion.outcome == 'success'
        shell: bash
        env:
          INDEPENDENT_HOLDOUT_SHA256: ${{ secrets.INDEPENDENT_HOLDOUT_SHA256 }}
          EVALUATION_AUDIT_SHA256: ${{ secrets.EVALUATION_AUDIT_SHA256 }}
        run: |
          curl --fail --location --retry 3 --max-time 300 \
            "https://github.com/chi-pao/-/releases/download/models-v1/used_house_model.joblib" \
            -o models/sites_baseline_used_house.joblib
          python export_sites_model.py \
            --approved models/candidates/approved_used_house.joblib \
            --approval models/candidates/approved_used_house.json \
            --baseline models/sites_baseline_used_house.joblib \
            --holdout data/unused_holdout.csv --output site-models
      - name: Publish portable model and retain the previous approved version
        if: steps.sites_bridge.outputs.exported == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site-models
          if ! git diff --cached --quiet; then
            git commit -m "Publish independently verified model for Sites"
            git push
          fi
; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A pinned hash for the holdout is unavailable; promotion is blocked."
          elif [ "$(sha256sum data/unused_holdout.csv | cut -d' ' -f1)" != "$(printf '%s' "$expected" | tr 'A-F' 'a-f')" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Holdout fingerprint mismatch."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate independent evaluation year
        id: holdoutyear
        if: steps.holdout.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          years = pd.to_numeric(pd.read_csv('data/unused_holdout.csv', usecols=['TransactionYear'])['TransactionYear'], errors='coerce')
          if years.isna().any() or not years.ge(1900).all() or not years.le(2200).all() or not years.eq(years.astype(int)).all():
              raise SystemExit('Holdout requires valid transaction years; exposure independence is checked before scoring')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('year=' + str(int(years.min())) + chr(10))
          PY
      - name: Choose current approved model as comparison baseline
        id: incumbent
        if: steps.data.outputs.available == 'true' && steps.holdout.outputs.available == 'true'
        shell: bash
        run: |
          if test -s models/candidates/approved_used_house.joblib && test -s models/candidates/approved_used_house.json; then
            python -c 'import json,hashlib,pathlib; p=pathlib.Path("models/candidates/approved_used_house.joblib"); m=json.loads(pathlib.Path("models/candidates/approved_used_house.json").read_text()); assert m.get("approved") is True and m.get("sha256")==hashlib.sha256(p.read_bytes()).hexdigest()'
            echo "path=models/candidates/approved_used_house.joblib" >> "$GITHUB_OUTPUT"
          elif test -s models/candidates/v7_used_house_candidate.joblib; then
            echo "path=models/candidates/v7_used_house_candidate.joblib" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither approved nor V7 incumbent exists in this runner; promotion cannot safely proceed."
            exit 1
          fi
      - name: Promote only after independent accuracy test
        id: promotion
        if: steps.data.outputs.available == 'true' && steps.holdout.outputs.available == 'true'
        env:
          EVALUATION_AUDIT_SHA256: ${{ secrets.EVALUATION_AUDIT_SHA256 }}
        run: |
          python promote_used_house.py \
            --incumbent ${{ steps.incumbent.outputs.path }} \
            --challenger models/candidates/adaptive_used_house_candidate.joblib \
            --holdout data/unused_holdout.csv \
            --holdout-year ${{ steps.holdoutyear.outputs.year }} --site .
      - name: Commit approved artifacts only
        if: steps.promotion.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/candidates/approved_used_house.joblib models/candidates/approved_used_house.json
          if ! git diff --cached --quiet; then
            git commit -m "Promote independently verified used-house model"
            git push
          fi

      - name: Export independently approved model for the Sites checker
        id: sites_bridge
        if: steps.promotion.outcome == 'success'
        shell: bash
        env:
          INDEPENDENT_HOLDOUT_SHA256: ${{ secrets.INDEPENDENT_HOLDOUT_SHA256 }}
          EVALUATION_AUDIT_SHA256: ${{ secrets.EVALUATION_AUDIT_SHA256 }}
        run: |
          curl --fail --location --retry 3 --max-time 300 \
            "https://github.com/chi-pao/-/releases/download/models-v1/used_house_model.joblib" \
            -o models/sites_baseline_used_house.joblib
          python export_sites_model.py \
            --approved models/candidates/approved_used_house.joblib \
            --approval models/candidates/approved_used_house.json \
            --baseline models/sites_baseline_used_house.joblib \
            --holdout data/unused_holdout.csv --output site-models
      - name: Publish portable model and retain the previous approved version
        if: steps.sites_bridge.outputs.exported == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site-models
          if ! git diff --cached --quiet; then
            git commit -m "Publish independently verified model for Sites"
            git push
          fi
