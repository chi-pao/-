name: OCR extraction regression
on:
  push:
    paths:
      - app.py
      - tests/test_ocr_regression.py
      - .github/workflows/ocr_regression.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python -m unittest discover -s tests -p 'test_ocr_regression.py' -v
