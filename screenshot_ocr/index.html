<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#10283d}
#zone{border:3px dashed #0c857c;background:#edf9f6;border-radius:15px;text-align:center;padding:22px 14px;cursor:pointer}
#zone:focus{outline:3px solid #efbf57} #zone strong{font-size:19px;display:block}
#zone span{font-size:14px;display:block;margin-top:8px}
#pick{margin-top:12px;background:#0c857c;color:white;border:0;border-radius:9px;padding:12px 22px;font-size:16px;font-weight:bold;cursor:pointer}
#status{font-size:14px;margin:12px 4px;min-height:25px}#preview{font-size:13px}
</style></head><body>
<div id="zone" tabindex="0" role="button" aria-label="スクリーンショットを選択または貼り付け">
<strong>📷 スクショをここに入れる</strong>
<span>画像を選ぶ・ドラッグする・クリックして Ctrl+V で貼り付け</span>
<button id="pick" type="button">画像を選ぶ</button>
<input id="file" type="file" accept="image/*" multiple hidden>
</div>
<div id="status" role="status">画像を入れると自動で文字を読み取り、物件情報を入力します。</div><div id="preview"></div>
<script>
const zone=document.getElementById('zone'),pick=document.getElementById('pick'),file=document.getElementById('file'),status=document.getElementById('status'),preview=document.getElementById('preview');
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
send('streamlit:componentReady',{apiVersion:1});function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}resize();
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')resize()});
pick.onclick=e=>{e.stopPropagation();file.click()};zone.onclick=e=>{if(e.target!==pick)file.click()};
file.onchange=e=>process(e.target.files);
zone.ondragover=e=>{e.preventDefault();zone.style.background='#d7f4e9'};
zone.ondragleave=()=>zone.style.background='';
zone.ondrop=e=>{e.preventDefault();zone.style.background='';process(e.dataTransfer.files)};
document.addEventListener('paste',e=>{const fs=Array.from(e.clipboardData?.items||[]).filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();process(fs)}});
let busy=false;
async function process(files){if(busy)return;const selected=Array.from(files||[]).filter(f=>f?.type.startsWith('image/'));if(!selected.length){status.textContent='画像を選んでください';return}
busy=true;pick.disabled=true;preview.textContent='';resize();
try{
if(!window.Tesseract){status.textContent='文字認識を準備しています…';await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const worker=await Tesseract.createWorker('jpn+eng');const results=[];
try{for(let i=0;i<selected.length;i++){status.textContent='文字認識中 '+(i+1)+'/'+selected.length+'枚…';resize();const img=await createImageBitmap(selected[i]);const scale=Math.min(2.5,Math.max(1,1800/img.width));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close();results.push((await worker.recognize(canvas)).data.text)}}finally{await worker.terminate()}
const raw=results.join('\n\n').trim();
if(!raw){status.textContent='文字が見つかりませんでした。文字の鮮明なスクショをお試しください';return}
status.textContent='文字認識が完了しました。抽出できた項目を下の入力欄へ反映します。';
send('streamlit:setComponentValue',{value:JSON.stringify({text:raw,nonce:Date.now()})});
}catch(err){status.textContent='読み取りに失敗しました。通信環境を確認してください：'+String(err?.message||err)}
finally{busy=false;pick.disabled=false;resize()}}
</script></body></html>
