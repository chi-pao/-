name: Public site availability check
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Streamlit health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://okaidokucyekka.streamlit.app/_stcore/health"
          for attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/site-health.txt -D /tmp/site-headers.txt -w '%{http_code}' --connect-timeout 15 --max-time 40 "$URL")" || code="000"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -Eiq '^ok[[:space:]]*$' /tmp/site-health.txt; then
              echo "Streamlit health endpoint is healthy."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "--- Diagnose: follow Streamlit's sign-in redirect with a cookie jar (what a browser does)"
          curl -sS -L --max-redirs 10 -c /tmp/jar -b /tmp/jar -o /tmp/follow.txt -D /tmp/follow-headers.txt \
            -w 'final_url=%{url_effective} final_code=%{http_code} redirects=%{num_redirects}\n' \
            --connect-timeout 15 --max-time 60 "$URL" || true
          grep -iE '^(HTTP/|location:)' /tmp/follow-headers.txt | sed -E 's/(state|code|token)=[^&]*/\1=***/g' || true
          echo "--- body (first 300 bytes)"; head -c 300 /tmp/follow.txt | tr -d '\r'; echo
          echo "::error::Streamlit health check failed (HTTP $code)."
          if [ -f /tmp/site-headers.txt ]; then
            grep -i '^location:' /tmp/site-headers.txt || true
          fi
          exit 1
